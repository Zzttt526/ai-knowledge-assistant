<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>智库 · AI Knowledge Assistant</title><link rel="stylesheet" href="styles.css"></head><body><aside><h1>◆ 智库</h1><a href="#chat">对话问答</a><a href="#documents">知识文档</a><label>API 地址<input id="api-base" value="http://localhost:8000/api/v1"></label><button id="save-api">保存地址</button></aside><main><section id="chat"><header><div><small>KNOWLEDGE CHAT</small><h2>问问你的知识库</h2></div><button id="new-chat">新建对话</button></header><div class="layout"><div class="panel"><div id="messages"><div class="welcome"><b>✦</b><h3>你好，我是智库助手</h3><p>上传文档后，我会基于知识库回答问题，并标注引用来源。</p></div></div><form id="chat-form"><textarea id="question" placeholder="例如：公司的年假政策是什么？" required></textarea><button>发送</button></form></div><div class="panel history"><h3>聊天历史</h3><div id="conversations">尚无历史对话</div></div></div></section><section id="documents" hidden><header><div><small>KNOWLEDGE BASE</small><h2>知识文档</h2><p>上传 PDF、TXT 或 Markdown，系统会自动解析并建立索引。</p></div></header><div class="panel upload"><form id="upload-form"><label>↑<b>选择要上传的文档</b><em>支持 PDF、TXT、Markdown</em><input id="document-file" type="file" accept=".pdf,.txt,.md,.markdown" required></label><button>上传并处理</button></form><p id="upload-status"></p></div><div class="panel"><h3>已索引文档 <button id="refresh-documents">刷新</button></h3><div id="documents-list">正在读取文档…</div></div></section></main><template id="source-template"><article class="source"><b></b><span></span><p></p></article></template><script src="app.js"></script></body></html>
